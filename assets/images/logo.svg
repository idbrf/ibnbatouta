<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Logo Icon Badge -->
  <g transform="translate(10, 10)" filter="url(#shadow)">
    <!-- Outer Shield / Hexagon -->
    <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    
    <!-- Compass Rose / Explorer Star (Ibn Batouta motif) -->
    <path d="M 50 16 L 56 38 L 78 44 L 56 50 L 50 72 L 44 50 L 22 44 L 44 38 Z" fill="url(#goldGrad)" opacity="0.4" />
    
    <!-- Stylized Modern Car Silhouette -->
    <path d="M 22 68 C 26 62, 34 52, 44 50 C 50 48, 62 48, 70 53 C 78 57, 82 63, 85 68 L 86 73 C 86 75, 84 77, 82 77 L 78 77 C 78 72, 74 68, 69 68 C 64 68, 60 72, 60 77 L 42 77 C 42 72, 38 68, 33 68 C 28 68, 24 72, 24 77 L 18 77 C 16 77, 15 75, 15 73 Z" fill="#FFFFFF" />
    
    <!-- Car Wheels -->
    <circle cx="33" cy="77" r="6" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="69" cy="77" r="6" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="2" />
    
    <!-- Windshield cut -->
    <path d="M 45 53 L 64 54 C 67 58, 69 62, 70 63 L 42 63 C 43 59, 44 55, 45 53 Z" fill="url(#blueGrad)" opacity="0.8" />
  </g>

  <!-- Arabic Brand Name -->
  <text x="130" y="52" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="28" font-weight="900" fill="#0F172A" letter-spacing="-0.5">
    كراء السيارات <tspan fill="url(#goldGrad)">ابن بطوطة</tspan>
  </text>
  
  <!-- Subtitle / French Branding -->
  <text x="130" y="82" font-family="'Segoe UI', 'Cairo', sans-serif" font-size="14" font-weight="700" fill="#64748B" letter-spacing="1.5">
    LOCATION DE VOITURES IBN BATOUTA
  </text>

  <!-- Star accents -->
  <g fill="url(#goldGrad)" transform="translate(480, 42)">
    <polygon points="0,-6 1.8,-1.8 6,-1.8 2.5,1 3.8,5.5 0,3 -3.8,5.5 -2.5,1 -6,-1.8 -1.8,-1.8" />
  </g>
</svg>
